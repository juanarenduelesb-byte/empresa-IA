# Comprobaciones sin IA en cada cambio (D-017). No usa tokens de Claude.
name: Comprobaciones
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: solo-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      VARIOS_TEST_DATABASE_URL: postgresql+psycopg://postgres:solo-ci@localhost:5432/postgres
      VARIOS_EXIGIR_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Estilo (Ruff) del código nuevo
        run: ruff check src migrations tests tools/pg_local.py
      - name: Migraciones al día con los modelos
        run: |
          VARIOS_DATABASE_URL_ADMIN=$VARIOS_TEST_DATABASE_URL alembic upgrade head
          VARIOS_DATABASE_URL_ADMIN=$VARIOS_TEST_DATABASE_URL alembic check
      - name: Pruebas
        run: python -m pytest -q
      - name: Revisión del repositorio (enlaces, fichas, agentes, secretos)
        run: python tools/check_repo.py
      - name: Generados al día
        run: |
          python tools/org_gen.py --check
          python tools/agentes_gen.py --check
          python tools/brain_build.py /tmp/brain.json && python -c "import json;a=json.load(open('/tmp/brain.json'));b=json.load(open('oficina/brain.json'));a.pop('built');b.pop('built');assert a==b, 'oficina/brain.json desactualizado: python3 tools/brain_build.py oficina/brain.json'" && git diff --exit-code knowledge/grafo/ && test -z "$(git status --porcelain knowledge/grafo/)"

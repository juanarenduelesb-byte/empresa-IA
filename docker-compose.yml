# Entorno local: PostgreSQL 16 y la API. Arranque: cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: varios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      VARIOS_APP_PASSWORD: ${VARIOS_APP_PASSWORD:?Define VARIOS_APP_PASSWORD en .env}
    # Solo en este ordenador: Docker publica por defecto en todas las direcciones (DOCKER-PUERTOS).
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - datos:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d varios"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      VARIOS_ENTORNO: ${VARIOS_ENTORNO:-local}
      VARIOS_DATABASE_URL: postgresql+psycopg://varios_app:${VARIOS_APP_PASSWORD}@db:5432/varios
      VARIOS_DATABASE_URL_ADMIN: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/varios
      VARIOS_JWT_SECRETO: ${VARIOS_JWT_SECRETO:?Define VARIOS_JWT_SECRETO en .env}
    ports: ["127.0.0.1:8000:8000"]
volumes:
  datos:

[project]
name = "varios"
version = "0.1.0"
description = "Varios: núcleo del sistema (prototipo mínimo, D-014)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["site", "oficina", "archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
